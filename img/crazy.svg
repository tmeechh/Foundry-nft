<svg viewBox="0 0 200 200" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Face -->
  <circle cx="100" cy="100" fill="yellow" r="78" stroke="black" stroke-width="3"/>

  <!-- Eyes (tilted and uneven sizes) -->
  <g class="eyes">
    <ellipse cx="70" cy="78" rx="10" ry="14" transform="rotate(-10 70 78)" fill="black"/>
    <ellipse cx="130" cy="85" rx="14" ry="10" transform="rotate(15 130 85)" fill="black"/>
  </g>

  <!-- Zig-zag mouth -->
  <path d="M60 130 Q80 120 90 135 Q100 150 110 130 Q120 115 140 140"
        fill="none" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tongue sticking out -->
  <path d="M95 135 Q100 160 105 135 Z" fill="red" stroke="black" stroke-width="2"/>

  <!-- One eyebrow raised for craziness -->
  <path d="M55 60 Q70 50 85 55" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <path d="M115 60 Q130 70 145 65" stroke="black" stroke-width="4" stroke-linecap="round"/>
</svg>
